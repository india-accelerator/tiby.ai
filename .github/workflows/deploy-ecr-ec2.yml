# Build api + web images, push to Amazon ECR, then SSH to EC2 and roll the stack.
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID       IAM user/role key with ECR push permissions
#   AWS_SECRET_ACCESS_KEY   Matching secret
#   EC2_HOST                Public IP or DNS of the instance (not the 172.31.x.x private IP)
#   EC2_USER                SSH user, typically ubuntu
#   EC2_SSH_PRIVATE_KEY     Private key whose public half is in EC2 ~/.ssh/authorized_keys
#
# Optional GitHub variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION              default: ap-south-1
#   ECR_API_REPOSITORY      default: tiby-api
#   ECR_WEB_REPOSITORY      default: tiby-web
#   EC2_COMPOSE_DIR         default: /opt/dify/docker
#                           Must be the directory that contains docker-compose.yaml
#                           (the folder whose name prefixes containers, e.g. docker-api-1)
#
# EC2 prerequisites:
#   - Docker Engine + Docker Compose plugin
#   - Port 22 reachable from GitHub-hosted runners (security group)
#   - Existing compose stack already running (db/redis/weaviate stay untouched)
#
# IAM (GitHub credentials) minimum:
#   ecr:GetAuthorizationToken
#   ecr:CreateRepository, ecr:DescribeRepositories
#   ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer
#   ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage

name: Build ECR and Deploy EC2

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "web/**"
      - "docker/**"
      - ".github/workflows/deploy-ecr-ec2.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ecr-ec2
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY || 'tiby-api' }}
  ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY || 'tiby-web' }}
  EC2_COMPOSE_DIR: ${{ vars.EC2_COMPOSE_DIR || '/opt/dify/docker' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: api
            repository: ${{ vars.ECR_API_REPOSITORY || 'tiby-api' }}
          - name: web
            context: web
            repository: ${{ vars.ECR_WEB_REPOSITORY || 'tiby-web' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          if ! aws ecr describe-repositories --repository-names "$REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR password for the instance
        id: ecr-password
        run: |
          PASSWORD="$(aws ecr get-login-password --region "${AWS_REGION}")"
          echo "::add-mask::${PASSWORD}"
          echo "password=${PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
          API_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ env.IMAGE_TAG }}
          WEB_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_WEB_REPOSITORY }}:${{ env.IMAGE_TAG }}
          COMPOSE_DIR: ${{ env.EC2_COMPOSE_DIR }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: ECR_REGISTRY,ECR_PASSWORD,API_IMAGE,WEB_IMAGE,COMPOSE_DIR,AWS_REGION
          script: |
            set -euo pipefail

            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "Pulling $API_IMAGE"
            docker pull "$API_IMAGE"
            echo "Pulling $WEB_IMAGE"
            docker pull "$WEB_IMAGE"

            cd "$COMPOSE_DIR"

            if [ ! -f docker-compose.yaml ] && [ ! -f docker-compose.yml ]; then
              echo "No docker-compose.yaml in $COMPOSE_DIR"
              exit 1
            fi

            COMPOSE_FILE="docker-compose.yaml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              COMPOSE_FILE="docker-compose.yml"
            fi

            OVERRIDE_FILE="docker-compose.ecr.yml"
            {
              echo "services:"
              echo "  api:"
              echo "    image: ${API_IMAGE}"
              echo "  worker:"
              echo "    image: ${API_IMAGE}"
              echo "  web:"
              echo "    image: ${WEB_IMAGE}"
            } > "$OVERRIDE_FILE"

            SERVICES="api worker web"
            EXISTING="$(docker compose -f "$COMPOSE_FILE" config --services)"
            for svc in worker_beat api_websocket; do
              if echo "$EXISTING" | grep -qx "$svc"; then
                printf "  %s:\n    image: %s\n" "$svc" "$API_IMAGE" >> "$OVERRIDE_FILE"
                SERVICES="$SERVICES $svc"
              fi
            done

            echo "Recreating: $SERVICES"
            # --no-deps keeps postgres / redis / weaviate / nginx running
            docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE_FILE" up -d --no-deps --force-recreate --pull missing $SERVICES

            docker image prune -f
            docker compose -f "$COMPOSE_FILE" -f "$OVERRIDE_FILE" ps
            docker logout "$ECR_REGISTRY" || true
